# Publishes the app (the static `src` folder) to GitHub Pages on every push to master, so the
# merged work is always testable at https://timothyhoytbsme.github.io/SynthDaw/ without a local
# checkout. Only master may deploy: the github-pages environment's branch rule rejects others.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp the deployed commit into the page header, so a stale cached copy is recognisable.
      - run: sed -i "s|<span id=\"app-version\">dev</span>|<span id=\"app-version\">${GITHUB_SHA::7}</span>|" src/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - id: deployment
        uses: actions/deploy-pages@v4
