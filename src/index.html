<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SynthDaw</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="app-header">
    <h1>SynthDaw</h1>
    <p class="app-subtitle">
      Click/tap a key, play with your computer keyboard (A W S E D F T G Y H U J),
      or plug in a MIDI controller.
    </p>
    <p id="midi-status" class="midi-status"></p>
  </header>
  <main>
    <div id="piano-trigger" class="piano" role="group" aria-label="On-screen piano"></div>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
