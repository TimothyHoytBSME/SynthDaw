<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SynthDaw</title>
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="app-header">
    <h1>SynthDaw</h1>
    <p class="app-subtitle">
      Double-click a lane to add a block, double-click a block to edit its notes. Play the
      selected track live with a MIDI controller or your computer keyboard.
    </p>
    <p id="keyboard-status" class="midi-status"></p>
    <p id="midi-status" class="midi-status"></p>
    <div id="project-controls" class="project-controls"></div>
  </header>
  <main>
    <section class="timeline-panel" aria-label="Timeline and transport">
      <div id="timeline"></div>
    </section>
    <section class="patch-panel" aria-label="Selected track's instrument">
      <div id="patch-editor" class="patch-editor"></div>
    </section>
    <section class="mixer-panel" aria-label="Mixer">
      <h2>Mixer</h2>
      <div id="mixer"></div>
    </section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
